workflows:
  stage-android-build:
    name: "Stage GZD - ZIP + signed APK + AAB"
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: 22
      java: 21

      android_signing:
        - gzd_android_keystore

      vars:
        ZIP_FILE: gdzie-z-dzieckiem-capacitor-v2.10.5.zip
        STAGE_ZIP_FILE: stage-gzd-capacitor-v2.10.5.zip
        APP_DIR: gzd_stage_app

        ANDROID_VERSION_NAME: 2.10.5
        ANDROID_COMPILE_SDK: '37'
        ANDROID_TARGET_SDK: '37'

        ANDROID_PLATFORM_PACKAGE: '37.0'
        ANDROID_BUILD_TOOLS: '37.0.0'

        ANDROID_GRADLE_PLUGIN_VERSION: '9.2.1'
        ANDROID_GRADLE_VERSION: '9.5.1'
        GOOGLE_SERVICES_PLUGIN_VERSION: '4.5.0'

        STAGE_APPLICATION_ID: eu.gdziezdzieckiem.stage
        STAGE_APP_NAME: Stage GZD
        STAGE_DOMAIN: stage.gdziezdzieckiem.eu

        ADI_REGISTRATION_TOKEN: CJGD3E3JVEQDAAAAAAAAAAAAAA

    scripts:

      - name: Unpack production ZIP
        script: |
          set -e

          rm -rf unzip_tmp "$APP_DIR"
          mkdir -p unzip_tmp "$APP_DIR"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Nie znaleziono $ZIP_FILE"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d unzip_tmp

          PACKAGE_JSON=$(find unzip_tmp -maxdepth 4 -name package.json | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: Nie znaleziono package.json."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$PACKAGE_JSON")

          echo "Source directory: $SOURCE_DIR"

          rsync -a "$SOURCE_DIR"/ "$APP_DIR"/

          echo "APP_DIR=$APP_DIR" >> "$CM_ENV"

      - name: Convert production project to Stage GZD
        script: |
          set -e
          cd "$APP_DIR"

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path(".")

          OLD_APP_ID = "eu.gdziezdzieckiem.app"
          NEW_APP_ID = "eu.gdziezdzieckiem.stage"

          OLD_PACKAGE_PATH = "eu/gdziezdzieckiem/app"
          NEW_PACKAGE_PATH = "eu/gdziezdzieckiem/stage"

          PROD_DOMAIN = "gdziezdzieckiem.eu"
          PROD_WWW_DOMAIN = "www.gdziezdzieckiem.eu"
          STAGE_DOMAIN = "stage.gdziezdzieckiem.eu"

          excluded_dirs = {
              ".git",
              "node_modules",
              "android",
              "ios",
              "dist",
              "build",
          }

          changed = []

          for path in ROOT.rglob("*"):
              if not path.is_file():
                  continue

              if any(part in excluded_dirs for part in path.parts):
                  continue

              try:
                  text = path.read_bytes().decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              original = text

              text = text.replace(
                  OLD_APP_ID,
                  NEW_APP_ID,
              )

              text = text.replace(
                  OLD_PACKAGE_PATH,
                  NEW_PACKAGE_PATH,
              )

              marker = "__GZD_STAGE_DOMAIN__"

              text = text.replace(
                  STAGE_DOMAIN,
                  marker,
              )

              text = text.replace(
                  PROD_WWW_DOMAIN,
                  STAGE_DOMAIN,
              )

              text = text.replace(
                  PROD_DOMAIN,
                  STAGE_DOMAIN,
              )

              text = text.replace(
                  marker,
                  STAGE_DOMAIN,
              )

              if text != original:
                  path.write_text(
                      text,
                      encoding="utf-8",
                  )

                  changed.append(
                      str(path)
                  )

          for filename in (
              "capacitor.config.ts",
              "capacitor.config.js",
              "capacitor.config.mjs",
          ):
              path = Path(filename)

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8",
              )

              text = re.sub(
                  r"""(appName\s*:\s*)(['"])(.*?)\2""",
                  r"\1'Stage GZD'",
                  text,
                  count=1,
              )

              text = re.sub(
                  r"""(appId\s*:\s*)(['"])(.*?)\2""",
                  r"\1'eu.gdziezdzieckiem.stage'",
                  text,
                  count=1,
              )

              path.write_text(
                  text,
                  encoding="utf-8",
              )

          json_config = Path(
              "capacitor.config.json"
          )

          if json_config.exists():
              data = json.loads(
                  json_config.read_text(
                      encoding="utf-8",
                  )
              )

              data["appId"] = (
                  "eu.gdziezdzieckiem.stage"
              )

              data["appName"] = (
                  "Stage GZD"
              )

              json_config.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

          bad_domain = re.compile(
              r"(?<!stage\.)gdziezdzieckiem\.eu",
              re.IGNORECASE,
          )

          remaining = []

          for path in ROOT.rglob("*"):
              if not path.is_file():
                  continue

              if any(
                  part in excluded_dirs
                  for part in path.parts
              ):
                  continue

              try:
                  text = path.read_text(
                      encoding="utf-8",
                  )
              except (
                  UnicodeDecodeError,
                  OSError,
              ):
                  continue

              if bad_domain.search(text):
                  remaining.append(
                      str(path)
                  )

          if remaining:
              print(
                  "ERROR: Pozostały odwołania do produkcji:"
              )

              for item in remaining:
                  print(
                      " -",
                      item,
                  )

              raise SystemExit(1)

          print(
              "Zmienione pliki:",
              len(changed),
          )

          print(
              "Application ID:",
              NEW_APP_ID,
          )

          print(
              "Domain:",
              STAGE_DOMAIN,
          )
          PY

      - name: Add Google verification token
        script: |
          set -e
          cd "$APP_DIR"

          mkdir -p assets

          printf '%s' \
            "$ADI_REGISTRATION_TOKEN" \
            > assets/adi-registration.properties

          echo "Token:"
          cat assets/adi-registration.properties
          echo ""

          if [ "$(cat assets/adi-registration.properties)" != "$ADI_REGISTRATION_TOKEN" ]; then
            echo "ERROR: Niepoprawny token."
            exit 1
          fi

      - name: Create Stage project ZIP
        script: |
          set -e

          rm -f \
            "$CM_BUILD_DIR/$STAGE_ZIP_FILE"

          (
            cd "$APP_DIR"

            zip -qry \
              "$CM_BUILD_DIR/$STAGE_ZIP_FILE" \
              .
          )

          echo "Stage ZIP:"

          ls -lh \
            "$CM_BUILD_DIR/$STAGE_ZIP_FILE"

          unzip -l \
            "$CM_BUILD_DIR/$STAGE_ZIP_FILE" \
            | grep \
              "assets/adi-registration.properties"

      - name: Install npm dependencies
        script: |
          set -e
          cd "$APP_DIR"

          npm config set registry \
            https://registry.npmjs.org/

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

          npm ci \
            --no-audit \
            --no-fund \
            --loglevel=info

      - name: Build web assets
        script: |
          set -e
          cd "$APP_DIR"

          npm run build
          npm run test:scroll-restore
          npm run test:android-navigation

      - name: Install Android API 37 SDK
        script: |
          set -e

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ] && \
             [ -n "$ANDROID_SDK_ROOT" ] && \
             [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ] && \
             [ -n "$ANDROID_HOME" ] && \
             [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Nie znaleziono sdkmanager."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo "SDK root:"
          echo "$SDK_ROOT"

          yes | "$SDKMANAGER" \
            --licenses \
            >/dev/null \
            || true

          "$SDKMANAGER" \
            --channel=3 \
            "platforms;android-$ANDROID_PLATFORM_PACKAGE" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "platform-tools"

          test -d \
            "$SDK_ROOT/platforms/android-$ANDROID_PLATFORM_PACKAGE"

          test -d \
            "$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"

          echo "Android API 37 SDK OK."

      - name: Add Android Capacitor project
        script: |
          set -e
          cd "$APP_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android native icons
        script: |
          set -e
          cd "$APP_DIR"

          if [ -f scripts/generate-native-icons-macos.sh ]; then

            chmod +x \
              scripts/generate-native-icons-macos.sh

            scripts/generate-native-icons-macos.sh
          fi

      - name: Sync and patch Android
        script: |
          set -e
          cd "$APP_DIR"

          npx cap sync android

          if [ -f scripts/patch-android.js ]; then
            node scripts/patch-android.js
          fi

          if [ -f scripts/patch-android-api37.js ]; then
            node scripts/patch-android-api37.js
          fi

      - name: Fix Stage MainActivity package
        script: |
          set -e
          cd "$APP_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          java_root = Path(
              "android/app/src/main/java"
          )

          target = (
              java_root
              / "eu"
              / "gdziezdzieckiem"
              / "stage"
              / "MainActivity.java"
          )

          candidates = list(
              java_root.rglob(
                  "MainActivity.java"
              )
          )

          print(
              "Znalezione MainActivity.java:"
          )

          for path in candidates:
              print(
                  f" - {path} "
                  f"({path.stat().st_size} bytes)"
              )

          if not candidates:
              raise SystemExit(
                  "ERROR: Nie znaleziono MainActivity.java"
              )

          # Zachowujemy większy plik.
          # Wygenerowany stub Capacitor jest mały,
          # a właściwy MainActivity GZD zawiera
          # rozbudowaną logikę aplikacji.

          source = max(
              candidates,
              key=lambda path:
                  path.stat().st_size,
          )

          print("")
          print("Zachowuję:")
          print(source)

          text = source.read_text(
              encoding="utf-8",
          )

          text, count = re.subn(
              r"^\s*package\s+"
              r"eu\.gdziezdzieckiem\.(?:app|stage)"
              r"\s*;",
              "package eu.gdziezdzieckiem.stage;",
              text,
              count=1,
              flags=re.MULTILINE,
          )

          if count == 0:
              if (
                  "package eu.gdziezdzieckiem.stage;"
                  not in text
              ):
                  raise SystemExit(
                      "ERROR: Nie można ustawić "
                      "pakietu MainActivity."
                  )

          target.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          target.write_text(
              text,
              encoding="utf-8",
          )

          for path in candidates:
              if (
                  path.resolve()
                  == target.resolve()
              ):
                  continue

              print(
                  "Usuwam duplikat:",
                  path,
              )

              path.unlink()

          old_dir = (
              java_root
              / "eu"
              / "gdziezdzieckiem"
              / "app"
          )

          try:
              if (
                  old_dir.exists()
                  and not any(
                      old_dir.iterdir()
                  )
              ):
                  old_dir.rmdir()

          except OSError:
              pass

          final_candidates = list(
              java_root.rglob(
                  "MainActivity.java"
              )
          )

          print("")
          print(
              "MainActivity po naprawie:"
          )

          for path in final_candidates:
              print(
                  f" - {path} "
                  f"({path.stat().st_size} bytes)"
              )

          if len(final_candidates) != 1:
              raise SystemExit(
                  "ERROR: Nadal istnieje "
                  f"{len(final_candidates)} "
                  "plików MainActivity.java"
              )

          if (
              final_candidates[0].resolve()
              != target.resolve()
          ):
              raise SystemExit(
                  "ERROR: MainActivity jest "
                  "w złej ścieżce."
              )

          final_text = target.read_text(
              encoding="utf-8",
          )

          if (
              "package eu.gdziezdzieckiem.stage;"
              not in final_text
          ):
              raise SystemExit(
                  "ERROR: Nieprawidłowy package."
              )

          print("")
          print("MainActivity OK:")
          print(target)
          PY

      - name: Set Stage GZD Android name
        script: |
          set -e
          cd "$APP_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if not strings.exists():
              raise SystemExit(
                  "ERROR: Brak strings.xml"
              )

          text = strings.read_text(
              encoding="utf-8",
          )

          def replace_string(
              source,
              name,
              value,
          ):
              pattern = (
                  r'(<string\s+name="'
                  + re.escape(name)
                  + r'">).*?(</string>)'
              )

              return re.sub(
                  pattern,
                  rf"\g<1>{value}\g<2>",
                  source,
              )

          text = replace_string(
              text,
              "app_name",
              "Stage GZD",
          )

          text = replace_string(
              text,
              "title_activity_main",
              "Stage GZD",
          )

          strings.write_text(
              text,
              encoding="utf-8",
          )

          print(text)
          PY

      - name: Add verification token to Android assets
        script: |
          set -e
          cd "$APP_DIR"

          TOKEN_SOURCE="assets/adi-registration.properties"

          TOKEN_TARGET="android/app/src/main/assets/adi-registration.properties"

          if [ ! -f "$TOKEN_SOURCE" ]; then
            echo "ERROR: Brak $TOKEN_SOURCE"
            exit 1
          fi

          mkdir -p \
            android/app/src/main/assets

          cp \
            "$TOKEN_SOURCE" \
            "$TOKEN_TARGET"

          echo "Token Android:"

          cat "$TOKEN_TARGET"
          echo ""

          if [ "$(cat "$TOKEN_TARGET")" != "$ADI_REGISTRATION_TOKEN" ]; then
            echo "ERROR: Token Android jest niepoprawny."
            exit 1
          fi

      - name: Verify Stage Android project
        script: |
          set -e
          cd "$APP_DIR"

          MAIN="android/app/src/main/java/eu/gdziezdzieckiem/stage/MainActivity.java"

          if [ ! -s "$MAIN" ]; then
            echo "ERROR: Brak:"
            echo "$MAIN"
            exit 1
          fi

          COUNT=$(
            find \
              android/app/src/main/java \
              -name MainActivity.java \
              | wc -l \
              | tr -d ' '
          )

          echo "Liczba MainActivity.java: $COUNT"

          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Musi istnieć dokładnie jeden MainActivity.java."

            find \
              android/app/src/main/java \
              -name MainActivity.java \
              -print

            exit 1
          fi

          grep -Fq \
            "package eu.gdziezdzieckiem.stage;" \
            "$MAIN"

          echo "MainActivity OK."

          echo ""
          echo "Stage domain:"

          grep -RIn \
            "stage.gdziezdzieckiem.eu" \
            android/app/src/main \
            | head -50 \
            || true

          echo ""
          echo "Stage GZD name:"

          grep -RIn \
            "Stage GZD" \
            android/app/src/main/res \
            || true

      - name: Verify Android signing key
        script: |
          set -e

          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Brak CM_KEYSTORE_PATH."
            exit 1
          fi

          KEY_OUTPUT=$(
            keytool \
              -list \
              -v \
              -keystore "$CM_KEYSTORE_PATH" \
              -alias "$CM_KEY_ALIAS" \
              -storepass "$CM_KEYSTORE_PASSWORD" \
              -keypass "$CM_KEY_PASSWORD"
          )

          ACTUAL_SHA256=$(
            echo "$KEY_OUTPUT" \
              | grep "SHA256:" \
              | head -n 1 \
              | sed \
                's/.*SHA256:[[:space:]]*//' \
              | tr -d '\r'
          )

          echo ""
          echo "========================================"
          echo "Android signing SHA-256:"
          echo "$ACTUAL_SHA256"
          echo "========================================"

          case "$ACTUAL_SHA256" in

            5E:AA:*)
              echo \
                "OK - klucz 5E:AA:..."
              ;;

            *)
              echo \
                "ERROR: Nieoczekiwany klucz."

              exit 1
              ;;
          esac

      - name: Calculate Android version code
        script: |
          set -e

          AUTO_BUILD_NUMBER=$(
            python3 <<'PY'
          from datetime import datetime, timezone

          base = datetime(
              2026,
              1,
              1,
              tzinfo=timezone.utc,
          )

          now = datetime.now(
              timezone.utc
          )

          print(
              1000000000
              + int(
                  (
                      now - base
                  ).total_seconds()
                  // 60
              )
          )
          PY
          )

          echo \
            "ANDROID_VERSION_CODE=$AUTO_BUILD_NUMBER" \
            >> "$CM_ENV"

          echo \
            "versionCode: $AUTO_BUILD_NUMBER"

      - name: Configure Android version and signing
        script: |
          set -e
          cd "$APP_DIR"

          cat > android/keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          build_file = Path(
              "android/app/build.gradle"
          )

          if not build_file.exists():
              raise SystemExit(
                  "ERROR: Brak build.gradle"
              )

          text = build_file.read_text(
              encoding="utf-8",
          )

          version_code = os.environ.get(
              "ANDROID_VERSION_CODE"
          )

          if not version_code:
              raise SystemExit(
                  "ERROR: Brak ANDROID_VERSION_CODE"
              )

          version_name = os.environ.get(
              "ANDROID_VERSION_NAME",
              "2.10.5",
          )

          text = re.sub(
              r"versionCode\s+\d+",
              f"versionCode {version_code}",
              text,
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              f'versionName "{version_name}"',
              text,
          )

          text = re.sub(
              r'applicationId\s+"[^"]+"',
              'applicationId "eu.gdziezdzieckiem.stage"',
              text,
          )

          def matching_brace(
              source,
              opening,
          ):
              depth = 0

              for i in range(
                  opening,
                  len(source),
              ):
                  if source[i] == "{":
                      depth += 1

                  elif source[i] == "}":
                      depth -= 1

                      if depth == 0:
                          return i

              return -1

          def find_block(
              source,
              name,
              start=0,
              end=None,
          ):
              if end is None:
                  end = len(source)

              pattern = re.compile(
                  r"(^|\n)([ \t]*)"
                  + re.escape(name)
                  + r"\s*\{"
              )

              match = pattern.search(
                  source,
                  start,
                  end,
              )

              if not match:
                  return None

              opening = source.find(
                  "{",
                  match.start(),
                  match.end(),
              )

              closing = matching_brace(
                  source,
                  opening,
              )

              if closing == -1:
                  return None

              return {
                  "match_start":
                      match.start(),

                  "open":
                      opening,

                  "close":
                      closing,
              }

          keystore_block = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('keystore.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """

          if (
              "keystorePropertiesFile = rootProject.file('keystore.properties')"
              not in text
          ):
              plugins = find_block(
                  text,
                  "plugins",
              )

              if plugins:
                  position = (
                      plugins["close"] + 1
                  )

                  text = (
                      text[:position]
                      + "\n\n"
                      + keystore_block
                      + text[position:]
                  )

              else:
                  text = (
                      keystore_block
                      + text
                  )

          android = find_block(
              text,
              "android",
          )

          if not android:
              raise SystemExit(
                  "ERROR: Brak android {}"
              )

          android_body = text[
              android["open"] + 1:
              android["close"]
          ]

          if (
              "signingConfigs {"
              not in android_body
          ):
              build_types = find_block(
                  text,
                  "buildTypes",
                  android["open"],
                  android["close"],
              )

              signing_block = """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """

              if build_types:
                  position = (
                      build_types[
                          "match_start"
                      ] + 1
                  )

                  text = (
                      text[:position]
                      + signing_block
                      + text[position:]
                  )

              else:
                  position = (
                      android["close"]
                  )

                  text = (
                      text[:position]
                      + "\n"
                      + signing_block
                      + text[position:]
                  )

          android = find_block(
              text,
              "android",
          )

          build_types = find_block(
              text,
              "buildTypes",
              android["open"],
              android["close"],
          )

          if not build_types:
              raise SystemExit(
                  "ERROR: Brak buildTypes."
              )

          release = find_block(
              text,
              "release",
              build_types["open"],
              build_types["close"],
          )

          if not release:
              position = (
                  build_types["open"]
                  + 1
              )

              text = (
                  text[:position]
                  + """
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
          """
                  + text[position:]
              )

          else:
              release_body = text[
                  release["open"] + 1:
                  release["close"]
              ]

              if (
                  "signingConfig signingConfigs.release"
                  not in release_body
              ):
                  position = (
                      release["open"] + 1
                  )

                  text = (
                      text[:position]
                      + "\n            signingConfig signingConfigs.release"
                      + text[position:]
                  )

          build_file.write_text(
              text,
              encoding="utf-8",
          )
          PY

          grep -n \
            "applicationId\|versionCode\|versionName\|signingConfig" \
            android/app/build.gradle \
            || true

      - name: Build signed APK and AAB
        script: |
          set -e
          cd "$APP_DIR/android"

          chmod +x ./gradlew

          ./gradlew \
            assembleRelease \
            bundleRelease

          echo ""
          echo "APK:"

          ls -lh \
            app/build/outputs/apk/release/*.apk

          echo ""
          echo "AAB:"

          ls -lh \
            app/build/outputs/bundle/release/*.aab

      - name: Verify final APK
        script: |
          set -euo pipefail
          cd "$APP_DIR/android"

          APK=$(
            find \
              app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | head -n 1
          )

          if [ -z "$APK" ]; then
            echo "ERROR: Brak APK."
            exit 1
          fi

          echo "========================================"
          echo "APK:"
          echo "$APK"
          echo "========================================"

          echo ""
          echo "Sprawdzam token Google..."

          TOKEN_IN_APK=$(
            unzip -p \
              "$APK" \
              assets/adi-registration.properties
          )

          if [ "$TOKEN_IN_APK" != "$ADI_REGISTRATION_TOKEN" ]; then
            echo "ERROR: Brak lub błędny token."
            exit 1
          fi

          echo "OK: assets/adi-registration.properties"
          echo "Token: $TOKEN_IN_APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          AAPT="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt"

          APKSIGNER="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"

          if [ ! -x "$AAPT" ]; then
            echo "ERROR: Brak aapt:"
            echo "$AAPT"
            exit 1
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: Brak apksigner:"
            echo "$APKSIGNER"
            exit 1
          fi

          echo ""
          echo "Sprawdzam package ID..."

          BADGING=$(
            "$AAPT" \
              dump badging \
              "$APK"
          )

          echo "$BADGING" \
            | grep \
              "package: name='eu.gdziezdzieckiem.stage'"

          echo \
            "OK: eu.gdziezdzieckiem.stage"

          echo ""
          echo "Nazwa aplikacji:"

          echo "$BADGING" \
            | grep -E \
              "application-label(:|-[^:]+:)'Stage GZD'" \
            | head -n 5 \
            || true

          echo ""
          echo "Sprawdzam podpis APK..."

          VERIFY_OUTPUT=$(
            "$APKSIGNER" \
              verify \
              --verbose \
              --print-certs \
              "$APK" \
              2>&1
          )

          printf '%s\n' \
            "$VERIFY_OUTPUT"

          echo ""
          echo \
            "apksigner verification: OK"

          #
          # SHA-256 certyfikatu APK.
          # Obsługuje stdout/stderr oraz format
          # zarówno z dwukropkami, jak i bez.
          #

          APK_CERT_SHA256=$(
            printf '%s\n' "$VERIFY_OUTPUT" \
              | sed -nE \
                's/^.*[Cc]ertificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' \
              | head -n 1
          )

          KEY_OUTPUT=$(
            keytool \
              -list \
              -v \
              -keystore "$CM_KEYSTORE_PATH" \
              -alias "$CM_KEY_ALIAS" \
              -storepass "$CM_KEYSTORE_PASSWORD" \
              -keypass "$CM_KEY_PASSWORD" \
              2>&1
          )

          KEY_CERT_SHA256=$(
            printf '%s\n' "$KEY_OUTPUT" \
              | sed -nE \
                's/^.*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' \
              | head -n 1
          )

          echo ""
          echo "========================================"
          echo "Certyfikat APK:"
          echo \
            "${APK_CERT_SHA256:-NIE ODCZYTANO}"

          echo ""
          echo "Certyfikat keystore:"
          echo \
            "${KEY_CERT_SHA256:-NIE ODCZYTANO}"
          echo "========================================"

          if [ -z "$KEY_CERT_SHA256" ]; then
            echo "ERROR: Nie udało się odczytać certyfikatu keystore."
            exit 1
          fi

          NORMALIZED_KEY=$(
            printf '%s' \
              "$KEY_CERT_SHA256" \
              | tr -d ': \r\n' \
              | tr \
                '[:lower:]' \
                '[:upper:]'
          )

          case "$NORMALIZED_KEY" in

            5EAA*)
              echo \
                "OK: keystore = klucz 5E:AA:..."
              ;;

            *)
              echo \
                "ERROR: Keystore nie jest kluczem 5E:AA:..."

              exit 1
              ;;
          esac

          if [ -n "$APK_CERT_SHA256" ]; then

            NORMALIZED_APK=$(
              printf '%s' \
                "$APK_CERT_SHA256" \
                | tr -d ': \r\n' \
                | tr \
                  '[:lower:]' \
                  '[:upper:]'
            )

            if [ "$NORMALIZED_APK" != "$NORMALIZED_KEY" ]; then
              echo \
                "ERROR: APK jest podpisany innym certyfikatem niż keystore."

              exit 1
            fi

            echo \
              "OK: APK i keystore mają ten sam certyfikat."

          else

            echo ""
            echo "UWAGA:"
            echo \
              "apksigner potwierdził poprawny podpis,"

            echo \
              "ale nie zwrócił fingerprintu certyfikatu"

            echo \
              "w oczekiwanym formacie."

            echo \
              "Nie przerywam buildu z tego powodu."
          fi

          echo ""
          echo "========================================"
          echo "FINAL APK VERIFIED"
          echo "Package: eu.gdziezdzieckiem.stage"
          echo "Token: OK"
          echo "Signature: OK"
          echo "Keystore: 5E:AA:..."
          echo "========================================"

      - name: Verify final AAB
        script: |
          set -e
          cd "$APP_DIR/android"

          AAB=$(
            find \
              app/build/outputs/bundle/release \
              -maxdepth 1 \
              -type f \
              -name '*.aab' \
              | head -n 1
          )

          if [ -z "$AAB" ]; then
            echo "ERROR: Brak AAB."
            exit 1
          fi

          echo "AAB:"
          echo "$AAB"

          unzip -l "$AAB" \
            | grep \
              "base/assets/adi-registration.properties"

          echo "AAB OK."

    artifacts:
      - stage-gzd-capacitor-v2.10.5.zip
      - gzd_stage_app/android/app/build/outputs/apk/release/*.apk
      - gzd_stage_app/android/app/build/outputs/bundle/release/*.aab
      - gzd_stage_app/android/app/build/outputs/mapping/release/mapping.txt
      - gzd_stage_app/android/app/build/reports/**
