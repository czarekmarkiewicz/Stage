workflows:
  check-android-signing-key:
    name: "Stage GZD - sprawdź klucz Android"
    max_build_duration: 10
    instance_type: mac_mini_m2

    environment:
      java: 21

      android_signing:
        - gzd_android_keystore

    scripts:
      - name: "Sprawdź SHA-256 klucza"
        script: |
          set -e

          EXPECTED_SHA256="0B:B0:7A:20:C5:BD:7E:3A:9E:1A:16:47:6D:0D:0F:0C:5B:69:84:A9:98:51:9A:0A:3E:E6:90:43:B8:92:A0:C3"

          echo "========================================"
          echo "Stage GZD - weryfikacja klucza"
          echo "========================================"
          echo ""
          echo "Package name:"
          echo "eu.gdziezdzieckiem.stage"
          echo ""
          echo "Oczekiwany SHA-256:"
          echo "$EXPECTED_SHA256"
          echo ""

          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "BŁĄD: CM_KEYSTORE_PATH jest pusty."
            echo "Sprawdź, czy w Codemagic istnieje signing configuration:"
            echo "gzd_android_keystore"
            exit 1
          fi

          if [ -z "$CM_KEY_ALIAS" ]; then
            echo "BŁĄD: CM_KEY_ALIAS jest pusty."
            exit 1
          fi

          echo "Keystore został znaleziony."
          echo "Alias: $CM_KEY_ALIAS"
          echo ""

          KEYTOOL_OUTPUT=$(keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -alias "$CM_KEY_ALIAS" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD")

          ACTUAL_SHA256=$(echo "$KEYTOOL_OUTPUT" \
            | grep "SHA256:" \
            | head -n 1 \
            | sed 's/.*SHA256:[[:space:]]*//' \
            | tr -d '\r')

          echo "========================================"
          echo "SHA-256 klucza w Codemagic:"
          echo "$ACTUAL_SHA256"
          echo "========================================"
          echo ""

          if [ "$ACTUAL_SHA256" = "$EXPECTED_SHA256" ]; then
            echo "========================================"
            echo "OK - TO JEST WŁAŚCIWY KLUCZ"
            echo "========================================"
            echo ""
            echo "Klucz gzd_android_keystore odpowiada kluczowi"
            echo "wymaganemu przez Google dla:"
            echo "eu.gdziezdzieckiem.stage"
          else
            echo "========================================"
            echo "NIEZGODNY KLUCZ"
            echo "========================================"
            echo ""
            echo "Google oczekuje:"
            echo "$EXPECTED_SHA256"
            echo ""
            echo "Codemagic posiada:"
            echo "$ACTUAL_SHA256"
            echo ""
            echo "Nie używaj tego klucza do APK weryfikacyjnego."
            exit 1
          fi
