- name: Install Android API 37 SDK
  script: |
    set -e

    SDKMANAGER="$(command -v sdkmanager || true)"

    if [ -z "$SDKMANAGER" ] && \
       [ -n "$ANDROID_SDK_ROOT" ] && \
       [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
      SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
    fi

    if [ -z "$SDKMANAGER" ] && \
       [ -n "$ANDROID_HOME" ] && \
       [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
      SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
    fi

    if [ -z "$SDKMANAGER" ]; then
      echo "ERROR: Nie znaleziono sdkmanager."
      exit 1
    fi

    echo "sdkmanager: $SDKMANAGER"

    yes | "$SDKMANAGER" --licenses >/dev/null || true

    echo "Sprawdzam dostępne paczki Android 17..."
    "$SDKMANAGER" --list --include_obsolete --channel=3 \
      | grep -E "android-37|build-tools;37" \
      || true

    echo "Instaluję Android 17 / API 37..."
    "$SDKMANAGER" --channel=3 \
      "platforms;android-37.0" \
      "build-tools;37.0.0" \
      "platform-tools"

    echo ""
    echo "Zainstalowane komponenty:"
    "$SDKMANAGER" --list_installed \
      | grep -E "platforms;android-37|build-tools;37|platform-tools"

    echo ""
    echo "Android API 37 SDK gotowy."
