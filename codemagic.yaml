workflows:
  stage-android-build:
    name: "Stage GZD - ZIP + signed APK + AAB"
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: 22
      java: 21

      android_signing:
        - gzd_android_keystore

      vars:
        ZIP_FILE: gdzie-z-dzieckiem-capacitor-v2.10.5.zip
        STAGE_ZIP_FILE: stage-gzd-capacitor-v2.10.5.zip
        APP_DIR: gzd_stage_app

        ANDROID_VERSION_NAME: 2.10.5
        ANDROID_COMPILE_SDK: '37'
        ANDROID_TARGET_SDK: '37'
        ANDROID_GRADLE_PLUGIN_VERSION: '9.2.1'
        ANDROID_GRADLE_VERSION: '9.5.1'
        GOOGLE_SERVICES_PLUGIN_VERSION: '4.5.0'

        STAGE_APPLICATION_ID: eu.gdziezdzieckiem.stage
        STAGE_APP_NAME: Stage GZD
        STAGE_DOMAIN: stage.gdziezdzieckiem.eu

        ADI_REGISTRATION_TOKEN: CJGD3E3JVEQDAAAAAAAAAAAAAA

    scripts:

      - name: Unpack production ZIP
        script: |
          set -e

          rm -rf unzip_tmp "$APP_DIR"
          mkdir -p unzip_tmp "$APP_DIR"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Nie znaleziono: $ZIP_FILE"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d unzip_tmp

          PACKAGE_JSON=$(find unzip_tmp -maxdepth 4 -name package.json | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "Nie znaleziono package.json w ZIP."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$PACKAGE_JSON")
          echo "Source directory: $SOURCE_DIR"

          rsync -a "$SOURCE_DIR"/ "$APP_DIR"/

          echo "APP_DIR=$APP_DIR" >> "$CM_ENV"

      - name: Convert production project to Stage GZD
        script: |
          set -e
          cd "$APP_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re
          import json

          ROOT = Path(".")

          OLD_APP_ID = "eu.gdziezdzieckiem.app"
          NEW_APP_ID = "eu.gdziezdzieckiem.stage"

          OLD_PACKAGE_PATH = "eu/gdziezdzieckiem/app"
          NEW_PACKAGE_PATH = "eu/gdziezdzieckiem/stage"

          PROD_DOMAIN = "gdziezdzieckiem.eu"
          STAGE_DOMAIN = "stage.gdziezdzieckiem.eu"

          excluded_dirs = {
              ".git",
              "node_modules",
              "android",
              "ios",
              "dist",
              "build",
          }

          changed = []

          for path in ROOT.rglob("*"):
              if not path.is_file():
                  continue

              if any(part in excluded_dirs for part in path.parts):
                  continue

              try:
                  raw = path.read_bytes()
                  text = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              original = text

              # Android / Capacitor application id.
              text = text.replace(OLD_APP_ID, NEW_APP_ID)
              text = text.replace(OLD_PACKAGE_PATH, NEW_PACKAGE_PATH)

              # Nie podwajaj "stage." przy ponownym uruchomieniu.
              marker = "__GZD_STAGE_DOMAIN__"
              text = text.replace(STAGE_DOMAIN, marker)

              # Wszystkie pozostałe odwołania do domeny produkcyjnej
              # kierujemy na stage.
              text = text.replace(PROD_DOMAIN, STAGE_DOMAIN)

              text = text.replace(marker, STAGE_DOMAIN)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          # Zmieniamy tylko nazwę aplikacji w konfiguracji Capacitor,
          # bez zmiany tekstów marketingowych/UI aplikacji.
          for filename in (
              "capacitor.config.ts",
              "capacitor.config.js",
              "capacitor.config.mjs",
          ):
              path = Path(filename)
              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")

              text = re.sub(
                  r"""(appName\s*:\s*)(['"])(.*?)\2""",
                  r"\1'Stage GZD'",
                  text,
                  count=1,
              )

              text = re.sub(
                  r"""(appId\s*:\s*)(['"])(.*?)\2""",
                  r"\1'eu.gdziezdzieckiem.stage'",
                  text,
                  count=1,
              )

              path.write_text(text, encoding="utf-8")

          json_config = Path("capacitor.config.json")
          if json_config.exists():
              data = json.loads(json_config.read_text(encoding="utf-8"))
              data["appId"] = "eu.gdziezdzieckiem.stage"
              data["appName"] = "Stage GZD"
              json_config.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          # Kontrola: w tekstowych plikach projektu nie może zostać
          # produkcyjna domena, poza fragmentem domeny stage.
          remaining = []

          prod_pattern = re.compile(
              r"(?<!stage\.)gdziezdzieckiem\.eu",
              re.IGNORECASE,
          )

          for path in ROOT.rglob("*"):
              if not path.is_file():
                  continue

              if any(part in excluded_dirs for part in path.parts):
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              if prod_pattern.search(text):
                  remaining.append(str(path))

          if remaining:
              print("ERROR: znaleziono pozostałe odwołania do produkcji:")
              for item in remaining:
                  print(" -", item)
              raise SystemExit(1)

          print("Zmienione pliki:", len(changed))
          print("Stage applicationId:", NEW_APP_ID)
          print("Stage domain:", STAGE_DOMAIN)
          PY

          mkdir -p assets

          printf '%s' "$ADI_REGISTRATION_TOKEN" \
            > assets/adi-registration.properties

          echo ""
          echo "Token source:"
          cat assets/adi-registration.properties
          echo ""

          if [ "$(cat assets/adi-registration.properties)" != "$ADI_REGISTRATION_TOKEN" ]; then
            echo "ERROR: niepoprawna zawartość tokena."
            exit 1
          fi

      - name: Create Stage project ZIP
        script: |
          set -e

          rm -f "$CM_BUILD_DIR/$STAGE_ZIP_FILE"

          (
            cd "$APP_DIR"
            zip -qry "$CM_BUILD_DIR/$STAGE_ZIP_FILE" .
          )

          echo "Created:"
          ls -lh "$CM_BUILD_DIR/$STAGE_ZIP_FILE"

          unzip -l "$CM_BUILD_DIR/$STAGE_ZIP_FILE" \
            | grep "assets/adi-registration.properties"

      - name: Install npm dependencies
        script: |
          set -e
          cd "$APP_DIR"

          npm config set registry https://registry.npmjs.org/

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

          npm ci --no-audit --no-fund --loglevel=info

      - name: Build web assets
        script: |
          set -e
          cd "$APP_DIR"

          npm run build
          npm run test:scroll-restore
          npm run test:android-navigation

      - name: Install Android API 37 SDK
        script: |
          set -e

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ] && \
             [ -n "$ANDROID_SDK_ROOT" ] && \
             [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ] && \
             [ -n "$ANDROID_HOME" ] && \
             [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Nie znaleziono sdkmanager."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --channel=3 \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;36.0.0"

      - name: Add Android Capacitor project
        script: |
          set -e
          cd "$APP_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android native icons
        script: |
          set -e
          cd "$APP_DIR"

          chmod +x scripts/generate-native-icons-macos.sh
          scripts/generate-native-icons-macos.sh

      - name: Sync and patch Android
        script: |
          set -e
          cd "$APP_DIR"

          npx cap sync android

          node scripts/patch-android.js
          node scripts/patch-android-api37.js

          npm run test:android-api37
          npm run test:generated-android
          npm run test:location

      - name: Add Google verification token to APK assets
        script: |
          set -e
          cd "$APP_DIR"

          TOKEN_SOURCE="assets/adi-registration.properties"
          TOKEN_TARGET="android/app/src/main/assets/adi-registration.properties"

          if [ ! -f "$TOKEN_SOURCE" ]; then
            echo "ERROR: brak $TOKEN_SOURCE"
            exit 1
          fi

          mkdir -p android/app/src/main/assets

          cp "$TOKEN_SOURCE" "$TOKEN_TARGET"

          echo "Native token:"
          cat "$TOKEN_TARGET"
          echo ""

          test "$(cat "$TOKEN_TARGET")" = "$ADI_REGISTRATION_TOKEN"

      - name: Verify Stage package and domain
        script: |
          set -e
          cd "$APP_DIR"

          ANDROID_MAIN="android/app/src/main/java/eu/gdziezdzieckiem/stage/MainActivity.java"
          ANDROID_MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -s "$ANDROID_MAIN" ]; then
            echo "ERROR: brak Stage MainActivity:"
            echo "$ANDROID_MAIN"
            exit 1
          fi

          if [ ! -s "$ANDROID_MANIFEST" ]; then
            echo "ERROR: brak AndroidManifest.xml"
            exit 1
          fi

          grep -Fq "stage.gdziezdzieckiem.eu" "$ANDROID_MAIN" || {
            echo "ERROR: Stage domain nie występuje w MainActivity."
            exit 1
          }

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android")

          bad = re.compile(
              r"(?<!stage\.)gdziezdzieckiem\.eu",
              re.IGNORECASE,
          )

          found = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              if bad.search(text):
                  found.append(str(path))

          if found:
              print("ERROR: produkcyjna domena w wygenerowanym Androidzie:")
              for p in found:
                  print(" -", p)
              raise SystemExit(1)

          print("Android Stage domain verified.")
          PY

          echo "Package path OK:"
          echo "$ANDROID_MAIN"

      - name: Verify Android signing key
        script: |
          set -e

          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: brak CM_KEYSTORE_PATH"
            exit 1
          fi

          KEY_OUTPUT=$(keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -alias "$CM_KEY_ALIAS" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD")

          ACTUAL_SHA256=$(echo "$KEY_OUTPUT" \
            | grep "SHA256:" \
            | head -n 1 \
            | sed 's/.*SHA256:[[:space:]]*//' \
            | tr -d '\r')

          echo "========================================"
          echo "Android signing SHA-256:"
          echo "$ACTUAL_SHA256"
          echo "========================================"

          case "$ACTUAL_SHA256" in
            5E:AA:*)
              echo "OK - używany jest klucz 5E:AA:..."
              ;;
            *)
              echo "ERROR: to nie jest oczekiwany klucz 5E:AA:..."
              exit 1
              ;;
          esac

      - name: Calculate Android version code
        script: |
          set -e
          cd "$APP_DIR"

          AUTO_BUILD_NUMBER=$(python3 <<'PY'
          from datetime import datetime, timezone

          base = datetime(2026, 1, 1, tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)

          print(
              1000000000
              + int((now - base).total_seconds() // 60)
          )
          PY
          )

          echo "ANDROID_VERSION_CODE=$AUTO_BUILD_NUMBER" >> "$CM_ENV"

          echo "Android versionCode: $AUTO_BUILD_NUMBER"

      - name: Configure Android version and release signing
        script: |
          set -e
          cd "$APP_DIR"

          cat > android/keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          build_file = Path("android/app/build.gradle")

          if not build_file.exists():
              print("Nie znaleziono android/app/build.gradle")
              sys.exit(1)

          text = build_file.read_text()

          version_code = os.environ.get("ANDROID_VERSION_CODE")

          if not version_code:
              print("Brak ANDROID_VERSION_CODE")
              sys.exit(1)

          version_name = os.environ.get(
              "ANDROID_VERSION_NAME",
              "2.10.5",
          )

          text = re.sub(
              r"versionCode\s+\d+",
              f"versionCode {version_code}",
              text,
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              f'versionName "{version_name}"',
              text,
          )

          def matching_brace(source, opening):
              depth = 0

              for i in range(opening, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1

                      if depth == 0:
                          return i

              return -1

          def find_block(source, name, start=0, end=None):
              if end is None:
                  end = len(source)

              pattern = re.compile(
                  r"(^|\n)([ \t]*)"
                  + re.escape(name)
                  + r"\s*\{"
              )

              match = pattern.search(source, start, end)

              if not match:
                  return None

              opening = source.find(
                  "{",
                  match.start(),
                  match.end(),
              )

              closing = matching_brace(source, opening)

              if closing == -1:
                  return None

              return {
                  "match_start": match.start(),
                  "open": opening,
                  "close": closing,
              }

          keystore_block = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('keystore.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """

          if (
              "keystorePropertiesFile = rootProject.file('keystore.properties')"
              not in text
          ):
              plugins = find_block(text, "plugins")

              if plugins:
                  pos = plugins["close"] + 1
                  text = (
                      text[:pos]
                      + "\n\n"
                      + keystore_block
                      + text[pos:]
                  )
              else:
                  text = keystore_block + text

          android = find_block(text, "android")

          if not android:
              print("Brak bloku android")
              sys.exit(1)

          android_body = text[
              android["open"] + 1:
              android["close"]
          ]

          if "signingConfigs {" not in android_body:
              build_types = find_block(
                  text,
                  "buildTypes",
                  android["open"],
                  android["close"],
              )

              signing_block = """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """

              if build_types:
                  pos = build_types["match_start"] + 1
                  text = (
                      text[:pos]
                      + signing_block
                      + text[pos:]
                  )
              else:
                  pos = android["close"]
                  text = (
                      text[:pos]
                      + "\n"
                      + signing_block
                      + text[pos:]
                  )

          android = find_block(text, "android")

          build_types = find_block(
              text,
              "buildTypes",
              android["open"],
              android["close"],
          )

          if not build_types:
              print("Brak buildTypes")
              sys.exit(1)

          release = find_block(
              text,
              "release",
              build_types["open"],
              build_types["close"],
          )

          if not release:
              pos = build_types["open"] + 1

              text = text[:pos] + """
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
          """ + text[pos:]

          else:
              release_body = text[
                  release["open"] + 1:
                  release["close"]
              ]

              if (
                  "signingConfig signingConfigs.release"
                  not in release_body
              ):
                  pos = release["open"] + 1
                  text = (
                      text[:pos]
                      + "\n            signingConfig signingConfigs.release"
                      + text[pos:]
                  )

          build_file.write_text(text)
          PY

          grep -n \
            "applicationId\|versionCode\|versionName\|signingConfig" \
            android/app/build.gradle || true

      - name: Build signed APK and AAB
        script: |
          set -e
          cd "$APP_DIR/android"

          chmod +x ./gradlew

          ./gradlew assembleRelease bundleRelease

          echo ""
          echo "APK:"
          ls -lh app/build/outputs/apk/release/*.apk

          echo ""
          echo "AAB:"
          ls -lh app/build/outputs/bundle/release/*.aab

      - name: Verify final APK
        script: |
          set -e
          cd "$APP_DIR/android"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: brak APK"
            exit 1
          fi

          echo "Checking: $APK"

          TOKEN_IN_APK=$(unzip -p \
            "$APK" \
            assets/adi-registration.properties)

          if [ "$TOKEN_IN_APK" != "$ADI_REGISTRATION_TOKEN" ]; then
            echo "ERROR: niepoprawny lub brakujący token w APK"
            exit 1
          fi

          echo "OK: assets/adi-registration.properties"

          AAPT=$(find \
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
            -type f \
            -name aapt \
            | sort -V \
            | tail -n 1)

          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" \
              | grep "package: name='eu.gdziezdzieckiem.stage'"

            "$AAPT" dump badging "$APK" \
              | grep -E "application-label:'Stage GZD'|application-label-.*:'Stage GZD'" \
              | head -n 1
          fi

          APKSIGNER=$(find \
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify \
              --verbose \
              --print-certs \
              "$APK"

            APK_SHA256=$(
              "$APKSIGNER" verify \
                --print-certs \
                "$APK" \
              | sed -n \
                's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1
            )

            echo "APK certificate SHA-256:"
            echo "$APK_SHA256"
          fi

          echo "Final APK verified."

      - name: Verify final AAB token
        script: |
          set -e
          cd "$APP_DIR/android"

          AAB=$(find app/build/outputs/bundle/release \
            -maxdepth 1 \
            -type f \
            -name '*.aab' \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: brak AAB"
            exit 1
          fi

          unzip -l "$AAB" \
            | grep "base/assets/adi-registration.properties"

          echo "Final AAB verified."

    artifacts:
      - stage-gzd-capacitor-v2.10.5.zip
      - gzd_stage_app/android/app/build/outputs/apk/release/*.apk
      - gzd_stage_app/android/app/build/outputs/bundle/release/*.aab
      - gzd_stage_app/android/app/build/outputs/mapping/release/mapping.txt
      - gzd_stage_app/android/app/build/reports/**
